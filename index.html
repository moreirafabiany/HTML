<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <title>Menu</title>

    <style>
        body {
            margin: 0;
            font-family: "Segoe UI", Arial, sans-serif;
            background: linear-gradient(135deg, #0a1444, #6a0dad); /* Blu scuro → Viola */
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .menu-container {
            background: #6a0dad; /* Viola */
            padding: 30px 40px;
            border-radius: 20px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.25);
            width: 350px;
            text-align: center;
        }

        .menu-container h1 {
            margin-top: 0;
            font-size: 26px;
            color: white; /* Testo bianco */
        }

        .menu-links {
            list-style: none;
            padding: 0;
            margin-top: 25px;
        }

        .menu-links li {
            margin: 15px 0;
        }

        .menu-links a {
            text-decoration: none;
            display: block;
            background: #8b22d6; /* Viola più chiaro per i bottoni */
            color: white; /* Testo bianco */
            padding: 12px 15px;
            border-radius: 10px;
            font-size: 18px;
            font-weight: 500;
            transition: 0.3s;
        }

        .menu-links a:hover {
            background: #b366ff; /* Viola chiaro hover */
            transform: translateY(-3px);
            box-shadow: 0 4px 10px rgba(0,0,0,0.25);
        }
    </style>
</head>

<body>
    <div class="menu-container">
        <h1>Menu</h1>

        <ul class="menu-links">
            <li><a href="anagrafica1.html">Anagrafica 1.0</a></li>
            <li><a href="anagrafica2.html">Anagrafica 2.0</a></li>
            <li><a href="anagrafica3.html">Anagrafica 3.0</a></li>
            <li><a href="anagrafica4.html">Anagrafica 4.0</a></li>
            <li><a href="stellaACinquePunte.html">Stella a cinque punte</a></li>
            <li><a href="grafico.html">Grafico da oggetto</a></li>
        </ul>
    </div>
</body>
</html>
